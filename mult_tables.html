<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplication Table</title>
  <style>
    body {
      margin: 0;
      padding: 32px 20px;
      /* color: #242424; */
      /* background: #f3f6f4; */
      font-family: Georgia, serif;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
    }

    h1 { font-size: 28px; }

    fieldset {
      margin: 24px 0;
      padding: 16px;
      border: 1px solid #aebdb4;
    }

    select {
      min-width: 120px;
      padding: 8px;
      border: 1px solid #aebdb4;
      font: inherit;
    }

    input { accent-color: #216548; }

    button {
      padding: 10px 24px;
      border: 0;
      border-radius: 4px;
      color: white;
      background: #216548;
      font: inherit;
      cursor: pointer;
    }

    button:hover { background: #174b35; }

    #check { margin-left: calc(48px + 3em); }

    :focus-visible { outline: 3px solid #b65b16; outline-offset: 3px; }

    #results {
      margin-top: 24px;
      font-size: 20px;
      font-variant-numeric: tabular-nums;
    }

    #results p { margin: 8px 0; }
  </style>
</head>
<body>
  <main>
    <h3>Multiplication Table</h3>
    <fieldset>
      <legend>Choose a number</legend>
      Number --->>> <select id="number-select" aria-label="Choose a number"></select>
    </fieldset>
    <button id="clear" type="button">Clear</button>
    <button id="check" type="button">Check</button>
    <div id="results" role="log" aria-label="Multiplication results" aria-live="polite"></div>
  </main>

  <script>
    let num = 1;
    let multiplier = 1;
    const numberSelect = document.getElementById('number-select');
    const results = document.getElementById('results');
    const clearButton = document.getElementById('clear');
    const checkButton = document.getElementById('check');

    for (let value = 1; value <= 20; value++) {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      numberSelect.append(option);
    }

    numberSelect.addEventListener('change', () => {
      num = Number(numberSelect.value);
      multiplier = 1;
      results.replaceChildren();
      checkButton.disabled = false;
    });

    clearButton.addEventListener('click', () => {
      results.replaceChildren();
      multiplier = 1;
      checkButton.disabled = false;
    });

    checkButton.addEventListener('click', () => {
      const line = document.createElement('p');
      line.textContent = `${num} x ${multiplier} = ${num * multiplier}`;
      results.append(line);
      if (multiplier === 10) {
        checkButton.disabled = true;
      } else {
        multiplier++;
      }
    });
  </script>
</body>
</html>
