<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplication Table</title>
  <style>
    body {
      margin: 0;
      padding: 32px 20px;
      /* color: #242424; */
      /* background: #f3f6f4; */
      font-family: Georgia, serif;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
    }

    h1 { font-size: 28px; }

    fieldset {
      margin: 24px 0;
      padding: 16px;
      border: 1px solid #aebdb4;
    }

    #numbers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
      gap: 12px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      padding: 4px 8px;
      border: 1px solid #aebdb4;
      cursor: pointer;
    }

    input { accent-color: #216548; }

    button {
      padding: 10px 24px;
      border: 0;
      border-radius: 4px;
      color: white;
      background: #216548;
      font: inherit;
      cursor: pointer;
    }

    button:hover { background: #174b35; }

    :focus-visible { outline: 3px solid #b65b16; outline-offset: 3px; }

    #results {
      margin-top: 24px;
      font-size: 20px;
      font-variant-numeric: tabular-nums;
    }

    #results p { margin: 8px 0; }
  </style>
</head>
<body>
  <main>
    <h1>Multiplication Table</h1>
    <fieldset>
      <legend>Choose a number</legend>
      <div id="numbers"></div>
    </fieldset>
    <button id="check" type="button">Check</button>
    <div id="results" role="log" aria-label="Multiplication results" aria-live="polite"></div>
  </main>

  <script>
    let num = 1;
    let multiplier = 1;
    const numbers = document.getElementById('numbers');
    const results = document.getElementById('results');

    for (let value = 1; value <= 20; value++) {
      const label = document.createElement('label');
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'number';
      radio.value = value;
      radio.checked = value === num;
      radio.addEventListener('change', () => {
        num = Number(radio.value);
        multiplier = 1;
        results.replaceChildren();
      });
      label.append(radio, document.createTextNode(String(value)));
      numbers.append(label);
    }

    document.getElementById('check').addEventListener('click', () => {
      const line = document.createElement('p');
      line.textContent = `${num} x ${multiplier} = ${num * multiplier}`;
      results.append(line);
      multiplier++;
    });
  </script>
</body>
</html>
